[project]
name = "addition-helix"
version = "0.1.0"
description = "Where does the addition helix come from? A diagnostic sweep over models × numeral scripts."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "accelerate>=0.30",
    "hf-transfer>=0.1.6",
    "python-dotenv>=1.0",
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "tqdm",
    "pillow>=10",
]

# These are loose scripts, not an installable package — don't try to build them.
[tool.uv]
package = false
